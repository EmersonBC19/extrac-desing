name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    name: Unitarias + integración
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/integration/plugin-pairing compara con la versión del hub previa a la
          # vinculación (git show aa0edfe~1): hace falta el historial completo
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # extractor.js (extensión + crawler) y dist/code.js (plugin) se generan con esbuild y se
      # versionan: la extensión se carga sin compilar. Falla si alguien editó la fuente y no regeneró.
      - name: Archivos generados al día
        run: npm run check:generated

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Compilar (contratos, plugin, hub)
        run: npm run build

      - name: Pruebas
        run: npm test
