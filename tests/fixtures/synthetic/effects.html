<!doctype html>
<html>
  <!-- Efectos CSS (fase 5.4): degradados con geometría, efectos nativos de Figma y rasterizados -->
  <body style="margin: 0; font-family: sans-serif">
    <main id="root" style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; width: 1200px">
      <div id="lin" style="width: 300px; height: 100px; background: linear-gradient(to bottom, red, blue)"></div>
      <div id="corner" style="width: 300px; height: 100px; background: linear-gradient(to top right, red, blue)"></div>
      <div
        id="rad"
        style="width: 200px; height: 100px; background: radial-gradient(circle at 25% 75%, #fff 0, #000 40px)"
      ></div>
      <div id="radkw" style="width: 200px; height: 100px; background: radial-gradient(circle, red, blue)"></div>
      <div
        id="con"
        style="width: 100px; height: 100px; background: conic-gradient(from 90deg, red, blue 50%, red)"
      ></div>
      <div
        id="layers"
        style="
          width: 100px;
          height: 100px;
          background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.2)), radial-gradient(red, blue);
        "
      ></div>
      <div id="blend" style="width: 100px; height: 100px; background: #f59e0b; mix-blend-mode: multiply"></div>
      <div
        id="fx"
        style="
          width: 100px;
          height: 100px;
          background: #16a34a;
          filter: blur(4px) drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.5)) opacity(50%);
        "
      ></div>
      <p id="tshadow" style="margin: 0; font-size: 24px; text-shadow: 1px 2px 3px rgba(255, 0, 0, 0.8)">Sombra</p>
      <div id="rot" style="width: 120px; height: 60px; background: #2563eb; color: #fff; transform: rotate(15deg)">
        <span>Rotado</span>
      </div>
      <div id="gray" style="width: 100px; height: 60px; background: #dc2626; filter: grayscale(1)">
        <span>Gris</span>
      </div>
      <div id="clip" style="width: 80px; height: 80px; background: #9333ea; clip-path: circle(50%)"></div>
      <div id="move" style="width: 80px; height: 40px; background: #0ea5e9; transform: translateX(10px) scale(1.1)">
        <span>Movido</span>
      </div>
    </main>
    <div id="huge" style="width: 2000px; height: 1500px; background: #eee; transform: rotate(1deg)"></div>
  </body>
</html>
