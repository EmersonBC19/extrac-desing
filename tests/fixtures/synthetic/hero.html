<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#0b1220;color:#fff;font-family:sans-serif}
.hero{display:flex;gap:56px;width:1200px;margin:40px auto;align-items:center}
.copy{display:flex;flex-direction:column;gap:24px;width:520px}
.eyebrow{margin-top:12px;font:12px/12px monospace;color:#f5c400;letter-spacing:2px}
.wa{display:flex;align-items:center;gap:16px;background:#1f8f3a;border-radius:14px;padding:16px}
.ico{width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center}
.ico svg{width:27px;height:27px}
.visual{position:relative;width:600px;height:380px}
.visual::before{content:"";position:absolute;inset:-6px;border-radius:18px;background:linear-gradient(135deg,#f5c40055,#1f8f3a55)}
.shot{position:relative;width:600px;height:380px;background:#1e293b;border-radius:12px}
</style></head><body><div class="hero" id="root">
 <div class="copy"><p class="eyebrow" style="margin-bottom:0">SOFTWARE PARA INGENIERÍA</p><h1 style="margin:0;font-size:60px">Ingeniería que toma forma.</h1>
  <a class="wa"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#1f8f3a"/></svg></span><span>Únete al grupo</span></a></div>
 <div class="visual"><div class="shot"></div></div>
</div></body></html>
