<!doctype html>
<html>
  <!-- Orden de capas (QA-8): un fondo fijo con z-index negativo al final del DOM va DEBAJO de todo;
       un aviso con z-index positivo al principio del DOM va ENCIMA -->
  <body
    style="
      margin: 0;
      font:
        16px Arial,
        sans-serif;
      background: #0b1220;
      color: #fff;
    "
  >
    <div id="page" style="position: relative; width: 1200px; height: 900px">
      <div
        id="badge"
        style="position: absolute; top: 10px; right: 10px; z-index: 5; background: #f59e0b; width: 80px; height: 30px"
      >
        Nuevo
      </div>
      <header style="height: 80px; background: #111827">Cabecera</header>
      <section style="height: 500px; padding: 40px"><h1 style="margin: 0">Ingeniería que toma forma</h1></section>
      <div id="bg" style="position: absolute; inset: 0; z-index: -1; background: #0f172a"></div>
    </div>
    <div id="stack" style="display: flex; flex-direction: column; gap: 10px; width: 300px; position: relative">
      <div style="height: 40px; background: #334155">Uno</div>
      <div style="height: 40px; background: #475569">Dos</div>
      <span id="decor" style="position: absolute; inset: 0; z-index: -1; background: #1e293b"></span>
    </div>
  </body>
</html>
