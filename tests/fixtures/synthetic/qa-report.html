<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>QA de diseño: informe</title>
    <!--
      Informe de QA legible (tests/integration/design-qa.test.ts), con lo que llenó el de apple.com/co de
      falsas diferencias: una fuente que Figma no tiene (SF Pro), un título con saltos de línea en el HTML,
      un borde solo abajo y un icono SVG. #prod es igual que #design salvo el color de los 6 enlaces: una
      misma diferencia en 6 capas, que el informe tiene que dar en una fila.
    -->
    <style>
      body { margin: 0; padding: 24px; display: flex; gap: 32px; align-items: flex-start; }
      .menu { width: 320px; display: flex; flex-direction: column; gap: 8px; padding: 16px; background: #fff;
        font-family: "SF Pro Text", -apple-system, sans-serif; border-bottom: 1px solid #d2d2d7; }
      h3 { margin: 0; font-size: 12px; line-height: 16px; font-weight: 600; color: #1d1d1f; }
      a { font-size: 12px; line-height: 16px; color: #424245; text-decoration: none; }
      .top { display: flex; align-items: center; gap: 8px; }
      #prod a { color: #cc0000; }
    </style>
  </head>
  <body>
    <div class="menu" id="design">
      <div class="top">
        <svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 2h12v12H2z" fill="#1d1d1f" /></svg>
        <h3>
          Descubrir
        </h3>
      </div>
      <a href="#">Mac</a><a href="#">iPad</a><a href="#">iPhone</a><a href="#">Watch</a><a href="#">AirPods</a><a href="#">Hogar</a>
    </div>
    <div class="menu" id="prod">
      <div class="top">
        <svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 2h12v12H2z" fill="#1d1d1f" /></svg>
        <h3>
          Descubrir
        </h3>
      </div>
      <a href="#">Mac</a><a href="#">iPad</a><a href="#">iPhone</a><a href="#">Watch</a><a href="#">AirPods</a><a href="#">Hogar</a>
    </div>
  </body>
</html>
