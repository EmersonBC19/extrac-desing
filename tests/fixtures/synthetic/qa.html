<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>QA de diseño</title>
    <!--
      QA de diseño contra producción (tests/integration/design-qa.test.ts).
      #design es lo que dibujó la diseñadora; #prod, lo que quedó en producción: otra estructura y otras
      clases, y desviaciones a propósito (padding 20 en vez de 24, título 15/22 600 en vez de 16/24 700,
      gris #6B7280 en vez de #64748B, radio 6 en vez de 8, un badge "Nuevo" de más y otro precio).
    -->
    <style>
      body {
        margin: 0;
        padding: 24px;
        display: flex;
        gap: 40px;
        align-items: flex-start;
        background: #f1f5f9;
        font-family: Inter, sans-serif;
      }

      .d-card {
        width: 320px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 24px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
      }
      .d-head {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .d-title {
        margin: 0;
        font:
          700 16px/24px Inter,
          sans-serif;
        color: #0f172a;
      }
      .d-sub {
        margin: 0;
        font:
          400 14px/20px Inter,
          sans-serif;
        color: #64748b;
      }
      .d-price {
        margin: 0;
        font:
          700 28px/36px Inter,
          sans-serif;
        color: #0f172a;
      }
      .d-cta {
        display: inline-flex;
        align-self: flex-start;
        padding: 10px 16px;
        background: #64748b;
        color: #ffffff;
        border-radius: 8px;
        font:
          600 14px/20px Inter,
          sans-serif;
      }
      .d-note {
        margin: 0;
        font:
          400 12px/16px Inter,
          sans-serif;
        color: #64748b;
      }

      .pricing-card {
        width: 320px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 20px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
      }
      .pricing-card .badge {
        align-self: flex-start;
        padding: 2px 8px;
        background: #dcfce7;
        color: #166534;
        font:
          600 12px/16px Inter,
          sans-serif;
        border-radius: 999px;
      }
      .pricing-card .title {
        margin: 0;
        font:
          600 15px/22px Inter,
          sans-serif;
        color: #0f172a;
      }
      .pricing-card .subtitle {
        margin: 0;
        font:
          400 14px/20px Inter,
          sans-serif;
        color: #64748b;
      }
      .pricing-card .price {
        margin: 0;
        font:
          700 28px/36px Inter,
          sans-serif;
        color: #0f172a;
      }
      .pricing-card .btn {
        display: inline-flex;
        align-self: flex-start;
        padding: 10px 16px;
        background: #6b7280;
        color: #ffffff;
        border-radius: 6px;
        font:
          600 14px/20px Inter,
          sans-serif;
        text-decoration: none;
      }
      .pricing-card .note {
        margin: 0;
        font:
          400 12px/16px Inter,
          sans-serif;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <article id="design" class="d-card">
      <div class="d-head">
        <h3 class="d-title">Plan Pro</h3>
        <p class="d-sub">Para equipos que crecen</p>
      </div>
      <p class="d-price">$20</p>
      <span class="d-cta">Elegir plan</span>
      <p class="d-note">Facturación mensual</p>
    </article>

    <div id="prod" class="pricing-card">
      <span class="badge">Nuevo</span>
      <h3 class="title">Plan Pro</h3>
      <p class="subtitle">Para equipos que crecen</p>
      <p class="price">$29</p>
      <a class="btn" href="#">Elegir plan</a>
      <p class="note">Facturación mensual</p>
    </div>
  </body>
</html>
